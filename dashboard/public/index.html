<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bot Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f4f6f9; color: #333; padding: 24px; }
    h1 { font-size: 22px; margin-bottom: 20px; }
    .stats { display: flex; gap: 16px; margin-bottom: 24px; }
    .stat { background: white; border-radius: 8px; padding: 16px 24px; flex: 1; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .stat .label { font-size: 12px; color: #888; margin-bottom: 4px; }
    .stat .value { font-size: 28px; font-weight: bold; }
    table { width: 100%; background: white; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); border-collapse: collapse; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
    th { background: #f9fafb; font-weight: 600; color: #555; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .badge.ACTIVE { background: #d1fae5; color: #065f46; }
    .badge.AWAITING_PAYMENT { background: #fef3c7; color: #92400e; }
    .badge.NEW { background: #e5e7eb; color: #374151; }
    .refresh { float: right; font-size: 13px; color: #888; }
  </style>
</head>
<body>
  <h1>📊 WhatsApp Bot Dashboard <span class="refresh" id="lastUpdated"></span></h1>

  <div class="stats">
    <div class="stat"><div class="label">Active Sessions</div><div class="value" id="countActive">—</div></div>
    <div class="stat"><div class="label">Awaiting Payment</div><div class="value" id="countAwaiting">—</div></div>
    <div class="stat"><div class="label">Total Users</div><div class="value" id="countTotal">—</div></div>
  </div>

  <table>
    <thead>
      <tr>
        <th>User</th>
        <th>Status</th>
        <th>Payment</th>
        <th>Time Left</th>
        <th>Messages</th>
        <th>Started</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <tr><td colspan="6" style="text-align:center;color:#aaa;padding:32px">Loading...</td></tr>
    </tbody>
  </table>

  <script>
    async function loadData() {
      const res = await fetch('/dashboard/api/sessions');
      const sessions = await res.json();

      document.getElementById('countActive').textContent = sessions.filter(s => s.state === 'ACTIVE').length;
      document.getElementById('countAwaiting').textContent = sessions.filter(s => s.state === 'AWAITING_PAYMENT').length;
      document.getElementById('countTotal').textContent = sessions.length;
      document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString();

      const tbody = document.getElementById('tableBody');
      if (sessions.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#aaa;padding:32px">No sessions yet</td></tr>';
        return;
      }

      tbody.innerHTML = sessions.map(s => `
        <tr>
          <td>${s.userId}</td>
          <td><span class="badge ${s.state}">${s.state.replace('_', ' ')}</span></td>
          <td>${s.paymentAmount ? `${s.paymentCurrency || ''} ${s.paymentAmount}` : '—'}</td>
          <td>${s.timeLeft !== null ? s.timeLeft + ' min' : '—'}</td>
          <td>${s.messageCount}</td>
          <td>${s.createdAt ? new Date(s.createdAt).toLocaleTimeString() : '—'}</td>
        </tr>
      `).join('');
    }

    loadData();
    setInterval(loadData, 10000); // refresh every 10 seconds
  </script>
</body>
</html>
